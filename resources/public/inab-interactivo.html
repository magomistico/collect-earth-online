<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: transparent;
      --text-main: #144933;
      --text-sig: #29825b;
      --text-sub: #4f6c5e;

    @media (prefers-color-scheme: dark) {

      height: 100%;

      display: flex;
      flex-direction: column;

      justify-content: center;
      user-select: none;

      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;

      z-index: 10;
      pointer-events: none;
      text-align: center;
      margin-top: auto;
      padding-bottom: 14px;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .brand-sig {
      color: var(--text-sig);
      font-weight: 700;
    }
    .brand-sub {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text-sub);
      margin-top: 3px;

</head>

  <script>
  (() => {
    'use strict';
    const canvas = document.getElementById('particles');
    const container = document.getElementById('container');
    const ctx = canvas.getContext('2d', { alpha: true });
    if (!ctx) return;

    let seed = 47029;
    const random = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    const shape = JSON.parse(document.getElementById('logo-shape').textContent);
    const palette = ['#2d6a4f', '#40916c', '#1b4332', '#52b788', '#74c69d'];

    // Sample particles for smooth performance
    const isMobile = window.innerWidth < 600;
    const particles = shape.filter((_, i) => !isMobile || i % 2 === 0).map(([x, y, bright], i) => ({
      ox: x + (random() - 0.5) * 0.6,
      oy: y + (random() - 0.5) * 0.6,
      x: 0, y: 0, vx: 0, vy: 0,
      phase: random() * Math.PI * 2,
      radius: 0.5 + random() * 0.5,
      color: i % 59 === 0 ? 4 : bright ? 3 : (i % 3),
      glow: i % 83 === 0
    }));

    let width = 1, height = 1, scale = 1, centerX = 0, centerY = 0, dpr = 1;
    let started = false, time = 0, lastTime = 0, frameId = 0;
    let pointer = { x: -9999, y: -9999, active: false };

    function resize() {
      const rect = container.getBoundingClientRect();
      const prevScale = scale, prevX = centerX, prevY = centerY;
      width = Math.max(1, rect.width);
      height = Math.max(1, rect.height);
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const availableHeight = height - 50;
      scale = Math.min(width * 0.85 / 470, availableHeight / 360, 1.4);
      centerX = width / 2;
      centerY = availableHeight / 2;

      for (const p of particles) {
        const tx = centerX + p.ox * scale;
        const ty = centerY + p.oy * scale;
        if (!started) {
          p.x = tx; p.y = ty;
        } else {
          p.x = centerX + (p.x - prevX) * scale / prevScale;
          p.y = centerY + (p.y - prevY) * scale / prevScale;
        }
      }
      started = true;
      render();
    }

    function update(delta) {
      const radius = Math.max(45, Math.min(100, width * 0.16));
      const sqRadius = radius * radius;
      const damping = Math.pow(0.88, delta);

      for (const p of particles) {
        const tx = centerX + p.ox * scale + Math.sin(time * 0.45 + p.phase) * 0.6 * scale;
        const ty = centerY + p.oy * scale + Math.cos(time * 0.4 + p.phase) * 0.6 * scale;

        p.vx += (tx - p.x) * 0.015 * delta;
        p.vy += (ty - p.y) * 0.015 * delta;

        if (pointer.active) {
          const dx = p.x - pointer.x;
          const dy = p.y - pointer.y;
          const distSq = dx * dx + dy * dy;
          if (distSq < sqRadius && distSq > 0.1) {
            const dist = Math.sqrt(distSq);
            const force = (1 - dist / radius) * 2.8 * delta;
            p.vx += (dx / dist) * force;
            p.vy += (dy / dist) * force;
          }
        }

        p.vx *= damping;
        p.vy *= damping;
        p.x += p.vx * delta;
        p.y += p.vy * delta;
      }
    }

    function render() {
      ctx.clearRect(0, 0, width, height);

      for (let c = 0; c < palette.length; c++) {
        ctx.fillStyle = palette[c];
        ctx.beginPath();
        for (const p of particles) {
          if (p.color !== c) continue;
          const r = Math.max(0.4, p.radius * Math.max(0.7, scale));
          ctx.moveTo(p.x + r, p.y);
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        }
        ctx.fill();
      }
    }

    function tick(timestamp) {
      const delta = lastTime ? Math.min(2, (timestamp - lastTime) / 16.667) : 1;
      lastTime = timestamp;
      time += delta / 60;
      update(delta);
      render();
      frameId = requestAnimationFrame(tick);
    }

    function disperse(x = centerX, y = centerY) {
      for (const p of particles) {
        const angle = Math.atan2(p.y - y, p.x - x) + (random() - 0.5) * 0.7;
        const speed = (6 + random() * 14) * Math.max(0.5, scale);
        p.vx += Math.cos(angle) * speed;
        p.vy += Math.sin(angle) * speed;
      }
    }

    function getPos(e) {
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    canvas.addEventListener('pointermove', e => {
      const pos = getPos(e);
      pointer = { ...pos, active: true };
    });
    canvas.addEventListener('pointerleave', () => { pointer.active = false; });
    canvas.addEventListener('pointerdown', e => {
      const pos = getPos(e);
      disperse(pos.x, pos.y);
    });

    window.addEventListener('resize', resize);
    resize();
    frameId = requestAnimationFrame(tick);
  })();
  </script>
